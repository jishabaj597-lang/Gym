<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c94a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xtreme Hub">
<title>New Xtreme Fitness Hub</title>
<style>
:root{--bg:#f6f1ec;--card:#fff;--ink:#201813;--mute:#6f6259;--brand:#c94a00;--brandink:#fff;--ok:#1c8a4a;--okbg:#dff3e6;--warn:#9a6500;--warnbg:#fdecc8;--bad:#b3261e;--badbg:#fbdcd9;--line:#e8dcd2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141010;--card:#211a17;--ink:#f6efe9;--mute:#b3a69c;--brand:#ff8a3d;--brandink:#1a0d03;--ok:#6fd89a;--okbg:#1d3a2a;--warn:#f2c35c;--warnbg:#3b2d0e;--bad:#ff8f86;--badbg:#44201e;--line:#3a2e28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141010;--card:#211a17;--ink:#f6efe9;--mute:#b3a69c;--brand:#ff8a3d;--brandink:#1a0d03;--ok:#6fd89a;--okbg:#1d3a2a;--warn:#f2c35c;--warnbg:#3b2d0e;--bad:#ff8f86;--badbg:#44201e;--line:#3a2e28;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--line)}
.stat .num{font-size:34px;line-height:1;color:var(--brand)}
.stat span{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--brand);color:var(--brandink);text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap;padding:8px 12px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}
form.open{display:grid}
form label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
form .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.m{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.m h2{font-size:18px;margin:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.meta{color:var(--mute);font-size:14px;margin:2px 0 10px}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts a{padding:8px 11px;font-size:14px}
.due{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
#rep{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;margin-top:10px}

body{min-height:100vh}
main{padding-bottom:24px}

.hero{position:relative;height:200px;overflow:hidden;background:#141010}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;opacity:0;transition:opacity 1s}
.slides img.on{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,8,3,.92),rgba(15,8,3,.1) 75%)}
.hero-t{position:absolute;left:16px;right:16px;bottom:14px}
.hero h1{margin:0;font:900 25px/1.05 "Arial Black","Segoe UI Black",system-ui,sans-serif;letter-spacing:-.4px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero .sub{color:#f1dfd0;margin:5px 0 0;font-size:14px}
.gal{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:130px 130px;gap:8px;margin-top:22px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.gal .g1{grid-row:1/3;object-position:50% 50%}
.gal .g2{object-position:50% 30%}
.gal .g3{object-position:50% 30%}
@media (prefers-reduced-motion:reduce){.slides img{transition:none}}

.hero{max-width:560px;margin:0 auto;border-radius:0 0 22px 22px;height:230px}
.hero h1{font-size:28px}
.gal{grid-template-rows:150px 150px}
.acts button,.acts a{min-height:42px;display:inline-flex;align-items:center}
.tabs button{min-height:40px}
input,select{min-height:44px;font-size:16px}
</style>
</head>

<script>
var KEY="gym-members-v1",FEES={1:1200,3:3000,6:5500,12:9000},PLAN={1:"1 month",3:"3 months",6:"6 months",12:"12 months"};
var members=[],filter="all";
function load(){try{var v=localStorage.getItem(KEY);members=v?JSON.parse(v):[]}catch(e){members=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(members))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addMonths(d,n){var x=new Date(d.getFullYear(),d.getMonth()+n,d.getDate());return x}
function daysLeft(m){return Math.round((parse(m.till)-today())/864e5)}
function due(m){return Math.max(0,m.fee-m.paid)}
function fmt(s){return parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function wa(phone,text){var n=String(phone).replace(/\D/g,"");if(n.length===10)n="91"+n;return"https://wa.me/"+n+"?text="+encodeURIComponent(text)}
function msg(m){var d=daysLeft(m),t="Hi "+m.name+", ";
 if(d<0)t+="your gym plan expired on "+fmt(m.till)+". Let us know if you would like to renew.";
 else if(d<=2)t+="your gym plan expires on "+fmt(m.till)+". Please renew soon.";
 else t+="your gym plan is valid till "+fmt(m.till)+".";
 if(due(m))t+=" ₹"+due(m)+" is pending.";return t+" – New Xtreme Fitness Hub"}
function stats(){var a=0,e=0,p=0;members.forEach(function(m){daysLeft(m)<0?e++:a++;p+=due(m)});
 document.getElementById("sA").textContent=a;document.getElementById("sE").textContent=e;document.getElementById("sP").textContent="₹"+p.toLocaleString("en-IN")}
var TABS=[["all","All"],["active","Active"],["soon","Expiring soon"],["expired","Expired"],["due","Dues"]];
function tabs(){document.getElementById("tabs").innerHTML=TABS.map(function(t){return'<button data-f="'+t[0]+'" aria-pressed="'+(filter===t[0])+'">'+t[1]+"</button>"}).join("")}
function match(m){var d=daysLeft(m);return filter==="all"||(filter==="active"&&d>=0)||(filter==="soon"&&d>=0&&d<=2)||(filter==="expired"&&d<0)||(filter==="due"&&due(m)>0)}
function render(){stats();tabs();
 var L=members.filter(match).sort(function(a,b){return parse(a.till)-parse(b.till)});
 var el=document.getElementById("list");
 if(!members.length){el.innerHTML='<div class="empty">No members yet. Tap “New member” to add your first one.<br><br><button class="alt" id="demo">Load sample members</button></div>';return}
 if(!L.length){el.innerHTML='<div class="empty">No members in this list.</div>';return}
 el.innerHTML=L.map(function(m){var d=daysLeft(m),tag=d<0?'<span class="tag t-bad">Expired</span>':d<=2?'<span class="tag t-warn">'+d+(d===1?" day left":" days left")+'</span>':'<span class="tag t-ok">Active</span>';
  return'<div class="m"><div class="top"><h2>'+esc(m.name)+"</h2>"+tag+'</div><p class="meta">'+PLAN[m.months]+" · valid till "+fmt(m.till)+(due(m)?' · <span class="due">₹'+due(m)+" pending</span>":" · Paid")+'</p><div class="acts">'+
  (due(m)?'<button data-a="paid" data-id="'+m.id+'">Mark paid</button>':"")+
  '<button class="alt" data-a="renew" data-id="'+m.id+'">Renew</button><a class="btn alt" target="_blank" rel="noopener" href="'+wa(m.phone,msg(m))+'">WhatsApp</a><button class="alt" data-a="del" data-id="'+m.id+'">Remove</button></div></div>'}).join("")}
function report(){var a=0,e=0,p=0,s=[];members.forEach(function(m){var d=daysLeft(m);d<0?e++:a++;p+=due(m);if(d>=0&&d<=2)s.push(m.name+" ("+fmt(m.till)+")")});
 return"New Xtreme Fitness Hub\nDaily report – "+today().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+"\nActive members: "+a+"\nExpired: "+e+"\nPending dues: ₹"+p.toLocaleString("en-IN")+"\nExpiring soon: "+(s.length?s.join(", "):"none")}
document.getElementById("today").textContent=today().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
document.getElementById("addBtn").onclick=function(){document.getElementById("f").classList.toggle("open")};
document.getElementById("repBtn").onclick=function(){var r=document.getElementById("rep");r.style.display="block";r.innerHTML=esc(report())+'<br><br><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(report())+'">Send on WhatsApp</a>'};
var f=document.getElementById("f");
f.months.onchange=function(){f.fee.value=FEES[f.months.value]};
f.fee.value=FEES[1];
f.onsubmit=function(e){e.preventDefault();var mo=+f.months.value,s=today();
 members.push({id:Date.now()+"",name:f.name.value.trim(),phone:f.phone.value,months:mo,fee:+f.fee.value,paid:Math.min(+f.paid.value||0,+f.fee.value),start:iso(s),till:iso(addMonths(s,mo))});
 save();f.reset();f.fee.value=FEES[1];f.classList.remove("open");render()};
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.id==="demo"){var t=today(),n=[["Amit Kumar",3,5],["Pooja Mehta",6,1],["Vikas Yadav",12,-4],["Neha Sharma",1,20]];
  members=n.map(function(x,i){var till=new Date(t.getTime()+x[2]*864e5);return{id:"d"+i,name:x[0],phone:"9876543210",months:x[1],fee:FEES[x[1]],paid:i===2?FEES[12]-500:FEES[x[1]],start:iso(addMonths(till,-x[1])),till:iso(till)}});save();render();return}
 if(b.dataset.f){filter=b.dataset.f;render();return}
 var m=members.filter(function(x){return x.id===b.dataset.id})[0];if(!m)return;
 if(b.dataset.a==="paid")m.paid=m.fee;
 if(b.dataset.a==="renew"){var base=daysLeft(m)<0?today():parse(m.till);m.till=iso(addMonths(base,m.months));m.paid=0}
 if(b.dataset.a==="del"){if(!confirm("Remove "+m.name+"?"))return;members=members.filter(function(x){return x!==m})}
 save();render()});
load();render();

(function(){var s=document.querySelectorAll(".slides img"),i=0;if(!s.length||matchMedia("(prefers-reduced-motion: reduce)").matches)return;setInterval(function(){s[i].classList.remove("on");i=(i+1)%s.length;s[i].classList.add("on")},4000)})();
</script>
</body>
</html>
